nt:30px Prata,Georgia,serif}.error p{color:#748078;font-size:11px;line-height:1.6}.loading{padding:50px 24px;text-align:center;color:#718078;font-size:11px}.footer{text-align:center;color:#8a938d;font-size:9px;margin-top:18px}.hidden{display:none!important}@media(max-width:650px){.topbar{height:64px;padding:0 14px;position:sticky;top:0;z-index:10}.brand{font-size:19px}.mark{width:34px;height:34px}.wrap{width:calc(100% - 18px);margin:12px auto 50px}.card{border-radius:17px}.hero{padding:23px 17px 20px}.hero-row{display:block}.order-number{display:block;margin-top:9px}.content{padding:0 17px 25px}.grid{grid-template-columns:1fr}.box{padding:15px}.button{width:100%;min-height:48px}.timeline{margin-top:4px}.step{min-height:62px}.hero h1{font-size:32px}.lang{font-size:16px}}

 const browser=(()=>{const x=(navigator.language||'es').toLowerCase();return x.startsWith('ru')?'ru':x.startsWith('de')?'de':x.startsWith('en')?'en':'es'})(); let lang=['es','en','de','ru'].includes(params.get('lang'))?params.get('lang'):(localStorage.getItem('panora-retail-language')||browser); let order=null;
 const t=k=>L[lang]?.[k]||L.es[k]||k, esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
 function money(v){return new Intl.NumberFormat(lang==='de'?'de-DE':lang==='ru'?'ru-RU':lang==='en'?'en-IE':'es-ES',{style:'currency',currency:'EUR'}).format(Number(v||0))}
 function date(v){if(!v)return'—';return new Intl.DateTimeFormat(lang==='de'?'de-DE':lang==='ru'?'ru-RU':lang==='en'?'en-GB':'es-ES',{weekday:'long',day:'numeric',month:'long'}).format(new Date(v+'T12:00:00'))}
 async function rpc(){const cfg=window.PANORA_SUPABASE;if(!cfg?.url||!cfg?.publishableKey)throw Error('setup');const r=await fetch(`${cfg.url}/rest/v1/rpc/panora_retail_order_status`,{method:'POST',cache:'no-store',headers:{apikey:cfg.publishableKey,'Content-Type':'application/json','Cache-Control':'no-cache'},body:JSON.stringify({p_public_token:token})});if(!r.ok)throw Error('fetch');const x=await r.json();return Array.isArray(x)?x[0]:x}
 function statusLabel(o){if(o.status==='cancelled')return t('cancelled');if(o.status==='completed')return t(o.fulfillment==='delivery'?'delivered':'completed');if(o.status==='delivering')return t('delivering');if(o.status==='ready')return t('ready');if(o.status==='preparing')return t('preparing');if(o.source==='bake_preorder'&&o.bake_completed)return t('baked');if(o.source==='bake_preorder')return t('scheduled');return t('received')}
 function steps(o){if(o.status==='cancelled')return[{key:'received',done:true},{key:'cancelledStep',done:true,current:true,desc:'cancelledDesc'}];const delivery=o.fulfillment==='delivery';let arr=[{key:'received',desc:'receivedDesc'}];if(o.source==='bake_preorder'){arr.push({key:'scheduled',desc:'scheduledDesc'});arr.push({key:'baked',desc:'bakedDesc'})}arr.push({key:'preparing',desc:'preparingDesc'},{key:'ready',desc:'readyDesc'});if(delivery)arr.push({key:'delivering',desc:'deliveringDesc'},{key:'delivered',desc:'deliveredDesc'});else arr.push({key:'completed',desc:'completedDesc'});let idx=0;if(o.status==='completed')idx=arr.length-1;else if(o.status==='delivering')idx=arr.findIndex(x=>x.key==='delivering');else if(o.status==='ready')idx=arr.findIndex(x=>x.key==='ready');else if(o.status==='preparing')idx=arr.findIndex(x=>x.key==='preparing');else if(o.source==='bake_preorder'&&o.bake_completed)idx=arr.findIndex(x=>x.key==='baked');else if(o.source==='bake_preorder')idx=arr.findIndex(x=>x.key==='scheduled');else idx=0;return arr.map((x,i)=>({...x,done:i<=idx,current:i===idx}))}
 function row(label,value){return `<div class="meta-row"><span>${esc(label)}</span><strong>${esc(value)}</strong></div>`}
 function render(){document.documentElement.lang=lang;$('#langSelect').value=lang;$('#loading').textContent=t('loading');$('#backStore').textContent=t('back');$('#newOrderButton').textContent=t('newOrder');$('#refreshButton').textContent=t('refresh');if(!order)return;$('#eyebrow').textContent=t('eyebrow');$('#title').textContent=t('title');$('#subtitle').textContent=t('subtitle');$('#orderNumber').textContent=`R-${String(order.order_number).padStart(4,'0')}`;$('#statusText').textContent=statusLabel(order);$('#statusChip').classList.toggle('cancelled',order.status==='cancelled');$('#timeline').innerHTML=steps(order).map(s=>`<div class="step ${s.done?'done':''} ${s.current?'current':''}"><div class="bullet">${s.done?'✓':'·'}</div><div><b>${esc(t(s.key))}</b><small>${esc(t(s.desc||s.key+'Desc'))}</small></div></div>`).join('');const isDelivery=order.fulfillment==='delivery';$('#pickupTitle').textContent=isDelivery?t('deliveryMethod'):t('pickup');$('#pickupMeta').innerHTML=row(t('date'),date(order.pickup_date))+row(t('time'),order.pickup_slot)+row(t('method'),isDelivery?t('deliveryMethod'):t('pickupMethod'))+(isDelivery&&order.delivery_address?row(t('deliveryAddress'),order.delivery_address):'')+row(t('source'),order.source==='bake_preorder'?t('preorder'):t('stock'));$('#paymentTitle').textContent=t('payment');const pay=order.payment_status==='paid'?t('paymentPaid'):order.payment_status==='refunded'?t('paymentRefunded'):order.payment_status==='failed'?t('paymentFailed'):(order.payment_method==='online'?t('paymentPendingOnline'):t('paymentPending'));$('#paymentMeta').innerHTML=row(t('payment'),pay);$('#itemsTitle').textContent=t('items');const items=Array.isArray(order.items)?order.items:[];$('#items').innerHTML=items.map(i=>`<div class="item"><div><strong>${esc(i['name_'+lang]||i.name_en||i.name_es||i.name_ru||i.product_id)}</strong><small>${esc(i.quantity)} ${esc(t('pcs'))} × ${esc(money(i.unit_price))}</small></div><b>${esc(money(Number(i.quantity)*Number(i.unit_price)))}</b></div>`).join('');$('#totalLabel').textContent=t('total');$('#totalValue').textContent=money(order.total);$('#contactTitle').textContent=t('contact');$('#contactText').textContent=order.pickup_note||t('contactDefault');const actions=[];if(order.contact_phone)actions.push(`<a class="button secondary" href="tel:${esc(order.contact_phone)}">${esc(order.contact_phone)}</a>`);if(order.contact_email)actions.push(`<a class="button secondary" href="mailto:${esc(order.contact_email)}">${esc(order.contact_email)}</a>`);$('#contactActions').innerHTML=actions.join('');$('#contactBox').classList.toggle('hidden',!order.contact_phone&&!order.contact_email&&!order.pickup_note);}
 async function load(){if(!token){showError();return}$('#loading').classList.remove('hidden');$('#orderView').classList.add('hidden');$('#error').classList.add('hidden');try{order=await rpc();if(!order?.order_number){showError();return}$('#loading').classList.add('hidden');$('#orderView').classList.remove('hidden');render()}catch{showError()}}
