 async function customerPushStatus(){

   const rows=await messageRpc('panora_retail_push_status',{p_public_token:token,p_endpoint:sub.endpoint});
   const row=Array.isArray(rows)?rows[0]:rows,active=Boolean(row?.active??row);

 async function syncCustomerPush({repair=false}={}){
